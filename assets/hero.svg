<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="88" y1="72" x2="1184" y2="584" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071321"/>
      <stop offset="0.55" stop-color="#0A1D36"/>
      <stop offset="1" stop-color="#132E54"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#122849" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0B1730" stop-opacity="0.92"/>
