  <g>
    <rect x="72" y="74" width="632" height="492" rx="28" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="108" y="156" fill="#9CC7FF" font-size="22" font-family="Helvetica, Arial, sans-serif" letter-spacing="4">42 GRAPHICS PROJECT</text>
    <text x="108" y="242" fill="white" font-size="78" font-weight="700" font-family="Helvetica, Arial, sans-serif">fractol</text>
    <text x="108" y="296" fill="#DBE6FF" font-size="26" font-family="Helvetica, Arial, sans-serif">Interactive fractal exploration in C with MiniLibX,</text>
    <text x="108" y="332" fill="#DBE6FF" font-size="26" font-family="Helvetica, Arial, sans-serif">escape-time rendering, zoom-centered navigation,</text>
    <text x="108" y="368" fill="#DBE6FF" font-size="26" font-family="Helvetica, Arial, sans-serif">palette cycling, and parameterized Julia sets.</text>

    <g>
      <rect x="108" y="414" width="124" height="44" rx="22" fill="#102544" stroke="#2E5D93"/>
      <text x="144" y="442" fill="#FDFDFD" font-size="20" font-family="Helvetica, Arial, sans-serif">C</text>
      <rect x="248" y="414" width="160" height="44" rx="22" fill="#102544" stroke="#2E5D93"/>
      <text x="280" y="442" fill="#FDFDFD" font-size="20" font-family="Helvetica, Arial, sans-serif">MiniLibX</text>
      <rect x="424" y="414" width="186" height="44" rx="22" fill="#102544" stroke="#2E5D93"/>
      <text x="456" y="442" fill="#FDFDFD" font-size="20" font-family="Helvetica, Arial, sans-serif">Complex Plane</text>
    </g>

    <g>
      <text x="108" y="504" fill="#8FB8EF" font-size="18" font-family="Helvetica, Arial, sans-serif">Built around low-level pixel writes, event hooks, numeric mapping,</text>
      <text x="108" y="532" fill="#8FB8EF" font-size="18" font-family="Helvetica, Arial, sans-serif">and real-time feedback rather than high-level graphics tooling.</text>
    </g>
  </g>

