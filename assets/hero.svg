      <text x="836" y="416" fill="url(#accent)" font-size="42" font-weight="700" font-family="Helvetica, Arial, sans-serif">636</text>

      <rect x="992" y="326" width="166" height="120" rx="22" fill="#11264A"/>
      <text x="1022" y="368" fill="#8CB6ED" font-size="18" font-family="Helvetica, Arial, sans-serif">Interaction</text>
      <text x="1022" y="416" fill="url(#accent)" font-size="36" font-weight="700" font-family="Helvetica, Arial, sans-serif">Live</text>
