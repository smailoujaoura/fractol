  <circle cx="1078" cy="132" r="114" fill="#53C9FF" fill-opacity="0.14" filter="url(#blur)"/>
  <circle cx="1116" cy="492" r="132" fill="#FF5D8F" fill-opacity="0.1" filter="url(#blur)"/>

