<svg width="1000" height="360" viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="48" x2="944" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081525"/>
      <stop offset="1" stop-color="#102645"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDB347"/>
      <stop offset="1" stop-color="#53C9FF"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="360" rx="28" fill="url(#bg)"/>
  <text x="48" y="62" fill="white" font-size="28" font-weight="700" font-family="Helvetica, Arial, sans-serif">Interactive Controls</text>
  <text x="48" y="92" fill="#8CB6ED" font-size="17" font-family="Helvetica, Arial, sans-serif">The viewer is built around immediate feedback: move, zoom, recolor, and refine iterations in real time.</text>

  <g transform="translate(48 130)">
    <rect width="208" height="182" rx="22" fill="#122849"/>
    <text x="24" y="38" fill="#DCE7FF" font-size="22" font-weight="700" font-family="Helvetica, Arial, sans-serif">Navigation</text>
    <rect x="24" y="70" width="54" height="54" rx="14" fill="#0B1730" stroke="#35649A"/>
    <text x="37" y="104" fill="white" font-size="18" font-weight="700" font-family="Helvetica, Arial, sans-serif">UP</text>
    <rect x="84" y="70" width="54" height="54" rx="14" fill="#0B1730" stroke="#35649A"/>
    <text x="88" y="104" fill="white" font-size="16" font-weight="700" font-family="Helvetica, Arial, sans-serif">DOWN</text>
    <rect x="24" y="128" width="54" height="54" rx="14" fill="#0B1730" stroke="#35649A"/>
    <text x="28" y="161" fill="white" font-size="14" font-weight="700" font-family="Helvetica, Arial, sans-serif">LEFT</text>
    <rect x="84" y="128" width="54" height="54" rx="14" fill="#0B1730" stroke="#35649A"/>
    <text x="85" y="161" fill="white" font-size="13" font-weight="700" font-family="Helvetica, Arial, sans-serif">RIGHT</text>
    <text x="154" y="102" fill="#8CB6ED" font-size="16" font-family="Helvetica, Arial, sans-serif">Pan</text>
    <text x="154" y="126" fill="#8CB6ED" font-size="16" font-family="Helvetica, Arial, sans-serif">the viewport</text>
  </g>

  <g transform="translate(280 130)">
    <rect width="208" height="182" rx="22" fill="#122849"/>
    <text x="24" y="38" fill="#DCE7FF" font-size="22" font-weight="700" font-family="Helvetica, Arial, sans-serif">Zoom</text>
    <circle cx="62" cy="104" r="34" fill="#0B1730" stroke="#35649A"/>
    <path d="M62 82V126M40 104H84" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 76C144 82 162 100 166 124" stroke="#8CB6ED" stroke-width="4" stroke-linecap="round"/>
    <path d="M122 132C144 128 162 116 174 96" stroke="#8CB6ED" stroke-width="4" stroke-linecap="round"/>
    <text x="24" y="164" fill="#8CB6ED" font-size="16" font-family="Helvetica, Arial, sans-serif">Mouse wheel zooms</text>
    <text x="24" y="186" fill="#8CB6ED" font-size="16" font-family="Helvetica, Arial, sans-serif">around the cursor position</text>
  </g>

  <g transform="translate(512 130)">
    <rect width="208" height="182" rx="22" fill="#122849"/>
    <text x="24" y="38" fill="#DCE7FF" font-size="22" font-weight="700" font-family="Helvetica, Arial, sans-serif">Refinement</text>
    <rect x="24" y="74" width="58" height="50" rx="14" fill="#0B1730" stroke="#35649A"/>
    <text x="47" y="106" fill="white" font-size="24" font-weight="700" font-family="Helvetica, Arial, sans-serif">+</text>
    <rect x="92" y="74" width="58" height="50" rx="14" fill="#0B1730" stroke="#35649A"/>
    <text x="115" y="106" fill="white" font-size="24" font-weight="700" font-family="Helvetica, Arial, sans-serif">-</text>
    <text x="24" y="160" fill="#8CB6ED" font-size="16" font-family="Helvetica, Arial, sans-serif">Raise or lower the</text>
    <text x="24" y="182" fill="#8CB6ED" font-size="16" font-family="Helvetica, Arial, sans-serif">iteration budget by 25</text>
  </g>

  <g transform="translate(744 130)">
    <rect width="208" height="182" rx="22" fill="#122849"/>
    <text x="24" y="38" fill="#DCE7FF" font-size="22" font-weight="700" font-family="Helvetica, Arial, sans-serif">Utility</text>
    <rect x="24" y="74" width="58" height="50" rx="14" fill="#0B1730" stroke="#35649A"/>
    <text x="46" y="106" fill="white" font-size="22" font-weight="700" font-family="Helvetica, Arial, sans-serif">R</text>
    <rect x="92" y="74" width="92" height="50" rx="14" fill="#0B1730" stroke="#35649A"/>
    <text x="112" y="105" fill="white" font-size="18" font-weight="700" font-family="Helvetica, Arial, sans-serif">SPACE</text>
    <text x="24" y="160" fill="#8CB6ED" font-size="16" font-family="Helvetica, Arial, sans-serif">Reset the view or cycle</text>
    <text x="24" y="182" fill="#8CB6ED" font-size="16" font-family="Helvetica, Arial, sans-serif">through color palettes</text>
  </g>
</svg>
